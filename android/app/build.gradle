plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.attendance"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 웹 소스는 저장소 루트의 www/ 폴더를 그대로 사용한다 (복사 불필요)
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../www']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
