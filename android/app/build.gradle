plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.attendance"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 웹 소스는 저장소 루트의 www/ 폴더를 그대로 사용한다 (복사 불필요)
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../www']
        }
    }

    // 고정 서명키. 이게 없으면 빌드할 때마다 서명이 달라져서
    // '기존 패키지와 충돌' 로 덮어쓰기 설치가 안 된다.
    signingConfigs {
        debug {
            storeFile file('../attendance.keystore')
            storePassword 'attendance'
            keyAlias 'attendance'
            keyPassword 'attendance'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 코틀린 라이브러리 버전을 하나로 통일한다.
    // (이게 없으면 kotlin-stdlib 1.8.22 와 kotlin-stdlib-jdk8 1.6.21 이 같이 딸려와
    //  '중복 클래스' 오류로 빌드가 깨진다)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'

    implementation 'androidx.appcompat:appcompat:1.7.0'
}
