name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: 자바 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/attendance.apk
          ls -la out

      - name: 결과물 업로드 (Actions 탭용)
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: out/attendance.apk

      - name: 릴리스에 올리기 (폰에서 바로 받기용)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/attendance.apk \
            --title "최신 APK" \
            --notes "폰에서 attendance.apk 를 눌러 설치하세요."
